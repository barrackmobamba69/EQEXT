<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab EQ Eight</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="titlebar">
  <button id="power" class="power" title="Capture this tab and enable the EQ">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
      <path d="M8 1.5 V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4.2 3.4 a5.4 5.4 0 1 0 7.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="title">EQ Eight</span>
  <span id="target" class="target">not capturing</span>
</header>
<main>
  <div id="bandRow" class="band-row"></div>
  <section class="controls">
    <div class="left" id="bandEdit">
      <div id="selLabel" class="sel-label"></div>
      <label class="num-field">Freq <input id="inFreq" type="number" min="20" max="20000" step="1"></label>
      <label class="num-field">Gain <input id="inGain" type="number" min="-15" max="15" step="0.5"></label>
      <label class="num-field">Q <input id="inQ" type="number" min="0.1" max="18" step="0.1"></label>
    </div>
  </section>
  <div id="status" class="status"></div>
</main>
<script src="shared.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
