<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab EQ Eight</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="titlebar">
  <button id="power" class="led" title="Capture this tab and enable the EQ"></button>
  <span class="fold" aria-hidden="true"></span>
  <span class="title">EQ Eight</span>
  <span id="target" class="target">not capturing</span>
</header>
<div class="device">
  <div class="col left">
    <div class="param" id="paramFreq">
      <div class="plabel">Freq</div>
      <canvas class="knob" id="knobFreq"></canvas>
      <div class="pval" id="valFreq"></div>
    </div>
    <div class="param" id="paramGain">
      <div class="plabel">Gain</div>
      <canvas class="knob" id="knobGain"></canvas>
      <div class="pval" id="valGain"></div>
    </div>
    <div class="param" id="paramQ">
      <div class="plabel">Q</div>
      <canvas class="knob" id="knobQ"></canvas>
      <div class="pval" id="valQ"></div>
    </div>
  </div>
  <div class="center">
    <canvas id="graph"></canvas>
    <div id="bandRow" class="band-row"></div>
  </div>
  <div class="col right">
    <button id="specToggle" class="icon-toggle on" title="Show/hide spectrum">
      <svg viewBox="0 0 14 12" width="14" height="12" aria-hidden="true">
        <path d="M1 11 V6 M4 11 V2 M7 11 V4 M10 11 V1 M13 11 V7"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="param">
      <div class="plabel">Adapt. Q</div>
      <button id="adaptQ" class="lbtn">Off</button>
    </div>
    <div class="param">
      <div class="plabel">Scale</div>
      <div class="valbox" id="boxScale">
        <span class="vtext" id="valScale">100 %</span>
        <div class="vbar" id="barScale"></div>
      </div>
    </div>
    <div class="param">
      <div class="plabel">Gain</div>
      <div class="valbox" id="boxOut">
        <span class="vtext" id="valOut">0.00 dB</span>
        <div class="vbar" id="barOut"></div>
      </div>
    </div>
  </div>
</div>
<div id="status" class="status"></div>
<div id="typeMenu" class="type-menu" hidden></div>
<script src="shared.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
