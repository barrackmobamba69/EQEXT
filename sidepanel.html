<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tab EQ Eight</title>
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
<header class="titlebar">
  <button id="power" class="power" title="Capture this tab and enable the EQ">
    <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true">
      <path d="M8 1.5 V7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M4.2 3.4 a5.4 5.4 0 1 0 7.6 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
  <span class="title">EQ Eight</span>
  <span id="target" class="target">not capturing</span>
</header>
<main>
  <canvas id="graph"></canvas>
  <div id="bandRow" class="band-row"></div>
  <section class="controls">
    <div class="left">
      <div id="selLabel" class="sel-label"></div>
      <div id="typeRow" class="type-row"></div>
      <div class="knob-group">
        <div class="knob-cell" id="cellFreq">
          <canvas class="knob" id="knobFreq"></canvas>
          <div class="kval" id="valFreq"></div>
          <div class="klbl">Freq</div>
        </div>
        <div class="knob-cell" id="cellGain">
          <canvas class="knob" id="knobGain"></canvas>
          <div class="kval" id="valGain"></div>
          <div class="klbl">Gain</div>
        </div>
        <div class="knob-cell" id="cellQ">
          <canvas class="knob" id="knobQ"></canvas>
          <div class="kval" id="valQ"></div>
          <div class="klbl">Q</div>
        </div>
      </div>
    </div>
    <div class="right">
      <button id="adaptQ" class="toggle">Adapt. Q</button>
      <div class="knob-cell">
        <canvas class="knob" id="knobScale"></canvas>
        <div class="kval" id="valScale"></div>
        <div class="klbl">Scale</div>
      </div>
      <div class="knob-cell">
        <canvas class="knob" id="knobOut"></canvas>
        <div class="kval" id="valOut"></div>
        <div class="klbl">Gain</div>
      </div>
    </div>
  </section>
  <div id="status" class="status"></div>
</main>
<script src="shared.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
